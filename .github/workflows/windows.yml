name: Windows build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore EzTorrent.slnx
      - name: Build
        run: dotnet build EzTorrent.slnx --no-restore -c Release
      - name: Test
        run: dotnet test EzTorrent.slnx --no-build --no-restore -c Release --logger trx --results-directory TestResults
